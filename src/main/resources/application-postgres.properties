# Perfil PostgreSQL: se activa con la variable SPRING_PROFILES_ACTIVE=postgres
# Solo cambian la conexion y el dialecto; el resto del codigo es el mismo.
spring.datasource.url=jdbc:postgresql://localhost:5432/personas
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
