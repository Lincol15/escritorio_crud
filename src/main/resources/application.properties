# Aplicacion de escritorio: sin servidor web
spring.main.web-application-type=none
spring.main.banner-mode=off

# Base de datos SQLite
spring.datasource.url=jdbc:sqlite:${user.home}/.gestion-personas/persona.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
# Flyway crea y actualiza las tablas; Hibernate ya no toca el esquema.
# (No se usa "validate": SQLite reporta el id como INTEGER y Hibernate espera BIGINT)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Flyway: scripts en db/migration/sqlite o db/migration/postgresql segun el motor
spring.flyway.locations=classpath:db/migration/{vendor}
# Si la base ya existia (creada con ddl-auto=update), se toma como version 1
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Registro de actividad
logging.level.root=WARN
logging.level.com.ejemplo.crudpersona=INFO
logging.level.org.hibernate.SQL=DEBUG
